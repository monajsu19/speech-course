<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're In | Articulation Bootcamp: Baby Steps</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fdf0d5;          /* papaya whip */
      --text: #003049;        /* deep space blue */
      --muted: #3d5a6c;
      --accent: #c1121f;      /* brick red */
      --accent-hover: #780000;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 560px; margin: 0 auto; padding: 96px 20px 40px; text-align: center; }
    h1 {
      font-family: "Anton", Impact, sans-serif;
      font-weight: 400;
      text-transform: uppercase;
      font-size: clamp(40px, 9vw, 64px);
      line-height: 1.05;
      color: var(--accent);
      margin-bottom: 20px;
    }
    p { font-size: 17px; margin-bottom: 14px; }
    .welcome {
      font-family: "Anton", Impact, sans-serif;
      text-transform: uppercase;
      font-size: clamp(22px, 5vw, 30px);
      line-height: 1.15;
      letter-spacing: 0.01em;
      color: var(--text);
    }
    .muted { color: var(--muted); font-size: 15px; }
    .cta {
      display: inline-block;
      margin-top: 18px;
      padding: 14px 28px;
      background: var(--accent);
      color: var(--bg);
      font-weight: 600;
      border-radius: 10px;
      text-decoration: none;
    }
    .cta:hover { background: var(--accent-hover); }

    .meme {
      display: block;
      width: min(300px, 80%);
      height: auto;
      margin: 8px auto 28px;
      border-radius: 8px;
      box-shadow: 0 6px 22px rgba(0, 48, 73, 0.22);
      transform: rotate(-2deg);
    }
    /* promotions → primary: a cursor drags the bootcamp email across, on a loop */
    .drag { position: relative; max-width: 440px; height: 150px; margin: 22px auto 10px; text-align: left; }
    .drag .box {
      position: absolute; top: 0; bottom: 0; width: 40%;
      padding: 8px;
      background: #fff;
      border: 1.5px solid rgba(0, 48, 73, 0.18);
      border-radius: 10px;
    }
    .drag .from { left: 0; }
    .drag .to { right: 0; }
    .drag .tab {
      display: flex; align-items: center; gap: 5px;
      height: 24px; margin-bottom: 8px;
      font-size: 11px; font-weight: 600; white-space: nowrap;
      color: var(--muted);
      border-bottom: 2px solid rgba(0, 48, 73, 0.18);
    }
    .drag .to .tab { color: var(--accent); border-bottom-color: var(--accent); }
    .drag .tab svg { width: 13px; height: 13px; flex: none; }
    .drag .row { height: 24px; margin-bottom: 6px; border-radius: 6px; background: rgba(0, 48, 73, 0.08); }
    .drag .slot { background: none; border: 1.5px dashed rgba(0, 48, 73, 0.25); }
    .drag .arrow { position: absolute; left: 40%; top: 50%; width: 20%; height: 22px; margin-top: -11px; color: var(--accent); }
    .drag .mail {
      position: absolute; top: 41.5px; left: 9.5px;
      display: flex; align-items: center; gap: 5px;
      width: calc(40% - 19px); height: 24px; padding: 0 6px;
      font-size: 10px; font-weight: 600; white-space: nowrap; overflow: hidden;
      color: var(--text);
      background: var(--bg);
      border: 1.5px solid var(--accent);
      border-radius: 6px;
      animation: drag-mail 6s ease-in-out infinite;
    }
    .drag .mail::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .drag .cursor {
      position: absolute; left: 32%; top: 118px;
      width: 20px; height: 20px;
      transform-origin: 0 0;
      filter: drop-shadow(0 1px 2px rgba(0, 48, 73, 0.35));
      animation: drag-cursor 6s ease-in-out infinite;
    }
    @keyframes drag-mail {
      0%, 18% { left: 9.5px; transform: none; box-shadow: none; opacity: 1; }
      22% { left: 9.5px; transform: scale(1.06) rotate(-3deg); box-shadow: 0 6px 14px rgba(0, 48, 73, 0.28); }
      58% { left: calc(60% + 9.5px); transform: scale(1.06) rotate(-3deg); box-shadow: 0 6px 14px rgba(0, 48, 73, 0.28); }
      63%, 90% { left: calc(60% + 9.5px); transform: none; box-shadow: none; opacity: 1; }
      95% { left: calc(60% + 9.5px); opacity: 0; }
      96% { left: 9.5px; opacity: 0; }
      100% { left: 9.5px; opacity: 1; }
    }
    @keyframes drag-cursor {
      0% { left: 32%; top: 118px; transform: scale(1); opacity: 0; }
      6% { opacity: 1; }
      18% { left: 20%; top: 52px; transform: scale(1); }
      22% { left: 20%; top: 52px; transform: scale(0.82); }
      58% { left: 80%; top: 52px; transform: scale(0.82); }
      63% { left: 80%; top: 52px; transform: scale(1); }
      78%, 90% { left: 88%; top: 112px; opacity: 1; }
      95%, 100% { left: 88%; top: 112px; opacity: 0; }
    }
    @media (max-width: 440px) { .drag .wide { display: none; } }
    @media (prefers-reduced-motion: reduce) {
      .drag .mail { animation: none; }
      .drag .cursor { display: none; }
    }
    #party { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    h1 { animation: pop 0.6s cubic-bezier(0.2, 1.6, 0.4, 1) both; }
    @keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { h1 { animation: none; } }
  </style>
</head>
<body>
  <main>
    <h1>you're in 🎤</h1>
    <img class="meme" src="images/courage-wolf-meme.jpg" alt="Courage Wolf meme: afraid of public speaking? make public speaking afraid of you" width="460" height="475" />
    <p class="welcome">welcome to the bootcamp</p>
    <p class="muted">check ur email for confirmation</p>
    <div class="drag" role="img" aria-label="Drag the bootcamp email from the Promotions or Spam folder into your Primary inbox">
      <div class="box from">
        <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z" /><circle cx="7.5" cy="7.5" r="1" /></svg>Promotions<span class="wide">&nbsp;/ Spam</span></div>
        <div class="row slot"></div><div class="row"></div><div class="row"></div>
      </div>
      <svg class="arrow" viewBox="0 0 60 22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11h34M38 3l9 8-9 8" /></svg>
      <div class="box to">
        <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2" /><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z" /></svg>Primary</div>
        <div class="row slot"></div><div class="row"></div><div class="row"></div>
      </div>
      <div class="mail">Articulation Bootcamp</div>
      <svg class="cursor" viewBox="0 0 24 24"><path d="M4 2l15 9.5-6.6 1.4 4 7.3-2.9 1.6-4-7.4L4 19z" fill="#003049" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" /></svg>
    </div>
    <p class="muted">if the email is in promo/spam/social, pls move it to primary so you don't miss any updates!</p>
    <a class="cta" href="index.html">back to the bootcamp</a>
  </main>

  <canvas id="party" aria-hidden="true"></canvas>
  <script>
    // redirect-based methods (Klarna, bank, etc.) land here even when they fail
    var params = new URLSearchParams(location.search);
    if (params.get("redirect_status") === "failed") {
      location.replace("checkout.html?canceled=1");
    } else if (params.get("payment_intent")) {
      // the function checks with Stripe before marking the order paid, so this can't be faked
      fetch("https://jiqunlcxytueqkotswjm.supabase.co/functions/v1/create-payment-intent", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "confirm", paymentIntent: params.get("payment_intent") }),
        keepalive: true
      }).catch(function () {}); // stripe-webhook is the backup
    }
  </script>
  <script>
    (function () {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var canvas = document.getElementById("party");
      var ctx = canvas.getContext("2d");
      // brick red, molten lava, deep space blue, steel blue
      var colors = ["#c1121f", "#780000", "#003049", "#669bbc"];
      var pieces = [];
      var dpr = window.devicePixelRatio || 1;
      var w, h;

      function resize() {
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function burst(x, y, count, spread, aim) {
        for (var i = 0; i < count; i++) {
          var angle = -Math.PI / 2 + (aim || 0) + (Math.random() - 0.5) * spread;
          var speed = 4 + Math.random() * 14;
          pieces.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 6 + Math.random() * 7,
            color: colors[(Math.random() * colors.length) | 0],
            spin: Math.random() * Math.PI,
            spinSpeed: (Math.random() - 0.5) * 0.35,
            round: Math.random() < 0.3,
            life: 0
          });
        }
      }

      function frame() {
        ctx.clearRect(0, 0, w, h);
        pieces = pieces.filter(function (p) { return p.y < h + 40 && p.life < 420; });
        pieces.forEach(function (p) {
          p.life++;
          p.vx *= 0.985;
          p.vy = p.vy * 0.985 + 0.28;
          p.x += p.vx;
          p.y += p.vy;
          p.spin += p.spinSpeed;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.spin);
          ctx.fillStyle = p.color;
          if (p.round) {
            ctx.beginPath();
            ctx.arc(0, 0, p.size / 2.4, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2 * Math.abs(Math.cos(p.spin * 2)) + 1);
          }
          ctx.restore();
        });
        if (pieces.length) requestAnimationFrame(frame);
        else ctx.clearRect(0, 0, w, h);
      }

      resize();
      window.addEventListener("resize", resize);
      // one big pop from the middle, then cannons from each bottom corner
      burst(w / 2, h * 0.45, 140, Math.PI * 2);
      setTimeout(function () { burst(0, h, 80, Math.PI / 4, 0.45); burst(w, h, 80, Math.PI / 4, -0.45); }, 350);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
