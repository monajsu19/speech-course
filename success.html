<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're In | Articulation Bootcamp: Baby Steps</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fdf0d5;          /* papaya whip */
      --text: #003049;        /* deep space blue */
      --muted: #3d5a6c;
      --accent: #c1121f;      /* brick red */
      --accent-hover: #780000;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 560px; margin: 0 auto; padding: 96px 20px 40px; text-align: center; }
    h1 {
      font-family: "Anton", Impact, sans-serif;
      font-weight: 400;
      text-transform: uppercase;
      font-size: clamp(40px, 9vw, 64px);
      line-height: 1.05;
      color: var(--accent);
      margin-bottom: 20px;
    }
    p { font-size: 17px; margin-bottom: 14px; }
    .muted { color: var(--muted); font-size: 15px; }
    .cta {
      display: inline-block;
      margin-top: 18px;
      padding: 14px 28px;
      background: var(--accent);
      color: var(--bg);
      font-weight: 600;
      border-radius: 10px;
      text-decoration: none;
    }
    .cta:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <main>
    <h1>you're in 🎤</h1>
    <p>payment received. welcome to the bootcamp.</p>
    <p class="muted">a receipt is on its way to your inbox, and I'll email you everything you need before we kick off.</p>
    <a class="cta" href="index.html">back to the bootcamp</a>
  </main>
</body>
</html>
